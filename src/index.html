<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>English Learning</title>
    <base href="/" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta
      name="description"
      content="Estudia y practica vocabulario en inglés con conjuntos, flashcards y repaso espaciado."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f6fb" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link
      rel="preload"
      href="/fonts/poppins-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/poppins-latin-600-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script>
      // Aplica el tema antes del primer pintado para evitar un destello del tema equivocado.
      // Debe coincidir con ThemeService (clave 'el-theme' y colores de la barra del navegador).
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem('el-theme');
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', theme === 'dark' ? '#101120' : '#f6f6fb');
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
